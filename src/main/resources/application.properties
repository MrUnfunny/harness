# ============================================================================
# Harness — tuning knobs
#
# All values here may be overridden at runtime via -D system properties, e.g.:
#   java -Dagent.maxRounds=40 -jar target/harness.jar ...
# CLI flags (--model, --ollama-host, --temperature, --mode) also override the
# values set here for a single invocation.
# ============================================================================

# ---- Ollama / model defaults (overridable via CLI flags) -------------------
ollama.host=http://localhost:11434
ollama.model=gemma4:e4b
ollama.temperature=0.2

# ---- Agent loop ------------------------------------------------------------
# Default operating mode: coding | neutral | stock_research
agent.defaultMode=coding
# Hard cap on tool-call rounds per user turn.
agent.maxRounds=25
# History compaction kicks in once total character length exceeds this budget.
agent.compactCharBudget=32000

# ---- Stock-research mode nudges -------------------------------------------
# Minimum tool usage before the agent is allowed to produce the final brief.
agent.stockResearch.minSearches=2
agent.stockResearch.minFetches=3
# How many times the harness will nudge before giving up and letting the turn end.
agent.stockResearch.maxNudges=2

# ---- Ollama client timeouts/retries ---------------------------------------
ollama.connectTimeoutSec=10
ollama.requestTimeoutMin=5
ollama.retryAttempts=3
ollama.retryInitialBackoffMs=500

# ---- Generic HTTP (web_fetch, web_search) ---------------------------------
http.connectTimeoutSec=10
http.requestTimeoutSec=20

# ---- web_fetch tool -------------------------------------------------------
webFetch.maxChars=50000
webFetch.userAgent=harness/0.1

# ---- web_search tool ------------------------------------------------------
webSearch.defaultMaxResults=10
webSearch.maxResultsCap=20
webSearch.retryBaseMs=1500
webSearch.retryJitterMs=500
webSearch.htmlEndpoint=https://html.duckduckgo.com/html/
webSearch.liteEndpoint=https://lite.duckduckgo.com/lite/
webSearch.userAgentHtml=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36
webSearch.userAgentLite=Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:124.0) Gecko/20100101 Firefox/124.0

# ---- file_read tool -------------------------------------------------------
fileRead.defaultMaxLines=2000

# ---- glob tool ------------------------------------------------------------
glob.maxResults=500

# ---- grep tool ------------------------------------------------------------
grep.defaultMaxResults=200
# Per-file byte cap; files above this size are skipped without being read.
grep.maxFileBytes=2000000

# ---- shell tool -----------------------------------------------------------
shell.defaultTimeoutSec=30
shell.maxTimeoutSec=300
# Cap on captured stdout/stderr per stream (bytes).
shell.maxStreamBytes=65536
